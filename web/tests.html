<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>EngiCalc — Unit Tests</title>
<style>
  body { font-family: 'Consolas', monospace; background: #1a1a2e; color: #e0e0e0; padding: 20px; }
  h1 { color: #FFB300; }
  .pass { color: #22E88A; }
  .fail { color: #FF5D5D; }
  .summary { font-size: 18px; margin-top: 20px; padding: 12px; border-radius: 8px; }
  .summary.ok { background: rgba(34,232,138,0.15); border: 1px solid #22E88A; }
  .summary.err { background: rgba(255,93,93,0.15); border: 1px solid #FF5D5D; }

<body>
<h1>EngiCalc Unit Tests</h1>
<div id="output"></div>
<div id="summary"></div>
<script src="js/gost-schematic.js"></script>
<script type="module">
const output = document.getElementById('output');
const summary = document.getElementById('summary');
let passed = 0, failed = 0;

function assert(name, actual, expected, tolerance = 0.01) {
  const diff = Math.abs(actual - expected);
  if (diff <= tolerance) {
    passed++;
    output.innerHTML += `<div class="test"><span class="pass">✓</span> ${name}: ${actual} ≈ ${expected}</div>`;
  } else {
    failed++;
    output.innerHTML += `<div class="test"><span class="fail">✗</span> ${name}: got ${actual}, expected ${expected} (diff: ${diff.toFixed(4)})</div>`;
  }
}

// Import calculation functions from modules
import { round } from './js/core.js';
import { selectCable } from './js/cable-select.js';
import { calcStripSystem } from './js/led-strip.js';
import { plotXY, niceNum, niceScale } from './js/chart.js';
import { awgArea, awgFromArea } from './js/cable-networks.js';
import { mvToC, cToMv, TC_COEFFS } from './js/industry.js';
import { rtdResistance, rtdTemperature, rtdR0 } from './js/data/rtd.js';
import { calcSleeve, sleeveWireLayout, sleeveCutScale } from './js/sleeve.js';
import { contactClosed } from './js/schematic-editor.js';
import { SLEEVES, SLEEVE_FAMILIES, FILL_LIMITS } from './js/data/sleeve-data.js';
import { STD_SECTIONS } from './js/data/cable-data.js';

// ==================== POWER ====================
function calcPower(P, U, phase, cos, eta) {
  return phase === 3 ? P * 1000 / (Math.sqrt(3) * U * cos * eta) : P * 1000 / (U * cos * eta);
}

assert('Power: 2.2kW/380V/3ph/0.85/0.92', calcPower(2.2, 380, 3, 0.85, 0.92), 4.27, 0.05);
assert('Power: 15kW/400V/3ph/0.85/0.92', calcPower(15, 400, 3, 0.85, 0.92), 27.64, 0.1);
assert('Power: 1kW/220V/1ph/1.0/1.0', calcPower(1, 220, 1, 1.0, 1.0), 4.55, 0.05);
assert('Power: 7.5kW/380V/3ph/0.85/0.9', calcPower(7.5, 380, 3, 0.85, 0.9), 14.98, 0.1);

// ==================== CABLE SELECTION ====================
// Тесты зовут боевую selectCable(), а не копию формулы: копия разошлась бы
// с модулем при первой же правке методики и перестала бы что-либо доказывать.

// Контрольный пример: 3 фазы 380 В, 15 кВт, cos φ 0.9, 50 м, медь, лоток,
// 3 нагруженные жилы, ПВХ, +25 °C, допустимое падение 3 %.
const cableBase = {
  netType: 'ac3', voltage: 380, loadMode: 'power', power: 15, cosPhi: 0.9, efficiency: 1,
  material: 'Cu', cores: 3, insulation: 'pvc', laying: 'tray',
  bundleCount: 1, ambientTemp: 25, length: 50, maxDropPercent: 3, parallelCount: 1
};
const cableRef = selectCable(cableBase);

assert('Cable: расчётный ток 15 кВт / 380 В / cos 0.9', cableRef.current, 25.32, 0.05);
assert('Cable: суммарная поправка (лоток 0.95 x 3 жилы 0.90)', cableRef.factors.total, 0.855, 0.001);
assert('Cable: допустимый ток для 4 мм² с поправками', cableRef.allowedCurrent, 32.49, 0.1);
assert('Cable: итоговое сечение', cableRef.section, 4, 0);
assert('Cable: падение напряжения, %', cableRef.dropPercent, 2.67, 0.05);
assert('Cable: номинал автомата', cableRef.breaker, 32, 0);
assert('Cable: температура жилы под нагрузкой, °C', cableRef.conductorTemp, 52.3, 0.5);
assertTrue('Cable: 2.5 мм² не проходит, требуется 4 мм² по нагреву',
  cableRef.criteria.find(c => c.name === 'heating').required === 4);
assertTrue('Cable: падение напряжения тоже требует 4 мм²',
  cableRef.criteria.find(c => c.name === 'drop').required === 4);
assertTrue('Cable: предупреждений нет', cableRef.warnings.length === 0);

// Алюминий проводит хуже — при том же токе нужно большее сечение.
const cableAl = selectCable({ ...cableBase, material: 'Al' });
assertTrue('Cable: алюминий требует большего сечения, чем медь', cableAl.section > cableRef.section);

// Жара снижает допустимый ток: при +45 °C поправка падает с 0.855 до 0.641.
const cableHot = selectCable({ ...cableBase, ambientTemp: 45 });
assert('Cable: поправка при +45 °C', cableHot.factors.total, 0.641, 0.002);
assertTrue('Cable: жара не уменьшает сечение', cableHot.section >= cableRef.section);

// Термическая стойкость: Smin = 5000 x sqrt(0.2) / 115 = 19.4 мм² -> ступень 25 мм².
const cableSC = selectCable({ ...cableBase, scCurrent: 5000, scTime: 0.2 });
assert('Cable: КЗ 5 кА за 0.2 с диктует сечение', cableSC.section, 25, 0);
assertTrue('Cable: лимитирующий критерий — термостойкость', cableSC.limiting === 'thermal');

// Параллельная прокладка делит ток между кабелями.
const cableOne = selectCable({ ...cableBase, maxDropPercent: 5 });
const cablePar = selectCable({ ...cableBase, maxDropPercent: 5, parallelCount: 2 });
assertTrue('Cable: два кабеля на фазу тоньше одного', cablePar.section <= cableOne.section);

// Ток за пределами ряда: предупреждение, а не молчаливое обрезание.
const cableOver = selectCable({ ...cableBase, loadMode: 'current', current: 900, maxDropPercent: 10 });
assertTrue('Cable: за пределом ряда сечение не выбирается', cableOver.section === null);
assertTrue('Cable: выдано предупреждение о выходе за ряд',
  cableOver.warnings.includes('cable.warn_over_range'));

// Однофазная сеть: ток без множителя sqrt(3), падение с множителем 2.
const cable1ph = selectCable({ ...cableBase, netType: 'ac1', voltage: 220, power: 3, length: 30, maxDropPercent: 5 });
assert('Cable: ток однофазной нагрузки 3 кВт / 220 В', cable1ph.current, 15.15, 0.05);

// Вырожденные входные данные возвращают ошибку, а не исключение.
assertTrue('Cable: нулевое напряжение отбито', selectCable({ ...cableBase, voltage: 0 }).error === 'cable.err_voltage');
assertTrue('Cable: cos φ > 1 отбит', selectCable({ ...cableBase, cosPhi: 1.5 }).error === 'cable.err_cos');
assertTrue('Cable: нулевая длина отбита', selectCable({ ...cableBase, length: 0 }).error === 'cable.err_length');


// ==================== LED STRIP ====================
// Лента — распределённая нагрузка: ток убывает вдоль трассы, поэтому падение
// на дорожках растёт квадратично по длине. Проверяем именно это, а не только
// арифметику провода.

// Контрольный пример ТЗ: 24 В, 14.4 Вт/м, 10 м, питание с одного конца,
// провод 5 м, сопротивление дорожек 0.2 Ом/м, допуск 5 %.
const lsBase = {
  mode: 'single', voltage: 24, wattPerMeter: 14.4, trackResistance: 0.2,
  length: 10, feedScheme: 'one', wireLength: 5, maxDropPercent: 5,
  material: 'Cu', parallelWires: 1, ambientTemp: 25, laying: 'air', psuReserve: 1.2
};
const lsRef = calcStripSystem(lsBase);
const lsB = lsRef.branches[0];

assert('LED strip: ток на метр 14.4 Вт/м / 24 В', lsB.currentPerMeter, 0.6, 0.001);
assert('LED strip: суммарный ток на 10 м', lsB.current, 6, 0.01);
assert('LED strip: мощность ленты', lsB.power, 144, 0.1);
assert('LED strip: просадка на дорожках r·i·L²/2', lsB.dropStrip, 6.0, 0.001);
assert('LED strip: номинал БП со запасом 1.2', lsRef.psu.watts, 200, 0);
assert('LED strip: оптимум точек питания', lsB.optimalFeedPoints, 5, 0);
assertTrue('LED strip: просадку создаёт лента, а не провод',
  lsRef.warnings.includes('ledstrip.warn_strip_dominates'));

// Формула провода из ТЗ: 2·I·L·rho/S при 1.5 мм² даёт ровно 0.7 В.
assert('LED strip: ΔU провода 6 А / 5 м / 1.5 мм²', 2 * 6 * 5 * 0.0175 / 1.5, 0.7, 0.001);

// Без сопротивления дорожек расчёт вырождается в обычную двухпроводную линию.
// ТЗ берёт 1.5 мм² как предположение для проверки; калькулятор ищет минимум и
// находит 1.0 мм² — 1.05 В против бюджета 1.2 В.
const lsWire = calcStripSystem({ ...lsBase, trackResistance: 0 });
assert('LED strip: минимальное сечение без дорожек', lsWire.branches[0].section, 1.0, 0);
assert('LED strip: ΔU при 1.0 мм²', lsWire.branches[0].dropWire, 2 * 6 * 5 * 0.0175 / 1.0, 0.001);
assertTrue('LED strip: подобранное сечение укладывается в бюджет',
  lsWire.branches[0].dropTotal <= lsWire.budgetVolts + 1e-9);

// Квадратичная зависимость: два конца дают ровно четверть, четыре точки —
// девятую часть от двух концов. Это главное свойство модели.
const lsOne = calcStripSystem({ ...lsBase, feedScheme: 'one', maxDropPercent: 50 });
const lsBoth = calcStripSystem({ ...lsBase, feedScheme: 'both', maxDropPercent: 50 });
const lsFour = calcStripSystem({ ...lsBase, feedScheme: 'multi', feedPoints: 4, maxDropPercent: 50 });
assert('LED strip: два конца вчетверо меньше одного',
  lsOne.branches[0].dropStrip / lsBoth.branches[0].dropStrip, 4, 1e-9);
assert('LED strip: четыре точки в девять раз меньше двух',
  lsBoth.branches[0].dropStrip / lsFour.branches[0].dropStrip, 9, 1e-9);

// 12 В при той же мощности — вдвое больший ток и вчетверо большая просадка.
const ls12 = calcStripSystem({ ...lsBase, voltage: 12, trackResistance: 0 });
const ls24 = calcStripSystem({ ...lsBase, voltage: 24, trackResistance: 0 });
assertTrue('LED strip: 12 В требует большего сечения, чем 24 В',
  ls12.branches[0].section > ls24.branches[0].section);

// Эпюра: при питании с одного конца монотонно падает, при питании с двух
// концов симметрична и имеет минимум в середине.
const lsProfOne = lsOne.profile[0].points;
assertTrue('LED strip: эпюра при одном конце монотонна',
  lsProfOne.every((pt, i) => i === 0 || pt[1] <= lsProfOne[i - 1][1] + 1e-9));
const lsProfBoth = lsBoth.profile[0].points;
assert('LED strip: при двух концах минимум в середине',
  lsProfBoth[Math.floor(lsProfBoth.length / 2)][1],
  Math.min(...lsProfBoth.map(pt => pt[1])), 1e-6);
assert('LED strip: края при двух концах равны между собой',
  lsProfBoth[0][1], lsProfBoth[lsProfBoth.length - 1][1], 1e-6);

// Несколько лент от одной точки: общий провод плюс ответвления.
const lsMulti = calcStripSystem({
  mode: 'multi-strip', voltage: 24, maxDropPercent: 5, material: 'Cu',
  parallelWires: 1, ambientTemp: 25, laying: 'air', psuReserve: 1.2,
  commonWireLength: 5,
  strips: [
    { label: 'A', length: 10, wattPerMeter: 14.4, trackResistance: 0.05, branchLength: 1,  feedScheme: 'both' },
    { label: 'B', length: 3,  wattPerMeter: 14.4, trackResistance: 0.05, branchLength: 15, feedScheme: 'both' }
  ]
});
assert('LED strip: суммарный ток равен сумме веток', lsMulti.totalCurrent,
  lsMulti.branches.reduce((sum, x) => sum + x.current, 0), 1e-9);
assert('LED strip: суммарная мощность 13 м', lsMulti.totalPower, 13 * 14.4, 0.01);
assert('LED strip: худшая ветка — максимум просадки',
  lsMulti.branches[lsMulti.worstBranch].dropTotal,
  Math.max(...lsMulti.branches.map(x => x.dropTotal)), 1e-12);
assertTrue('LED strip: все ветки уложились в допуск',
  lsMulti.branches.every(x => x.dropPercent <= 5 + 1e-9));
// Ветка B тянет втрое меньший ток, но её ответвление в пятнадцать раз длиннее,
// поэтому провод ей нужен толще. На глаз это не угадывается.
assertTrue('LED strip: меньший ток на длинном ответвлении требует большего сечения',
  lsMulti.branches[1].current < lsMulti.branches[0].current
  && lsMulti.branches[1].section > lsMulti.branches[0].section);

// Одна лента в таблице должна дать то же, что режим одной ленты.
const lsAsTable = calcStripSystem({
  mode: 'multi-strip', voltage: 24, maxDropPercent: 5, material: 'Cu',
  parallelWires: 1, ambientTemp: 25, laying: 'air', psuReserve: 1.2, commonWireLength: 0,
  strips: [{ length: 10, wattPerMeter: 14.4, trackResistance: 0.2, branchLength: 5, feedScheme: 'one' }]
});
assert('LED strip: режимы не разъехались', lsAsTable.branches[0].dropTotal, lsB.dropTotal, 1e-9);

// Вырожденные данные возвращают ключ ошибки, а не исключение.
assertTrue('LED strip: нулевое напряжение отбито',
  calcStripSystem({ ...lsBase, voltage: 0 }).error === 'ledstrip.err_voltage');
assertTrue('LED strip: нулевая длина отбита',
  calcStripSystem({ ...lsBase, length: 0 }).error === 'ledstrip.err_length');
assertTrue('LED strip: пустая таблица отбита',
  calcStripSystem({ mode: 'multi-strip', voltage: 24, strips: [] }).error === 'ledstrip.err_no_strips');

// ==================== CHART ====================
// niceNum и niceScale перенесены из schematic-editor.js в chart.js — проверяем,
// что перенос ничего не изменил.
assert('Chart: niceNum(1, true)', niceNum(1, true), 1, 0);
assert('Chart: niceNum(0, true) не делит на ноль', niceNum(0, true), 1, 0);
assert('Chart: niceScale(0, 10, 5).step', niceScale(0, 10, 5).step, 2, 0);
assert('Chart: niceScale(0, 10, 5).hi', niceScale(0, 10, 5).hi, 10, 0);
assert('Chart: niceScale(-3.7, 8.2, 5).lo кратен шагу',
  niceScale(-3.7, 8.2, 5).lo % niceScale(-3.7, 8.2, 5).step, 0, 1e-9);
assertTrue('Chart: plotXY отдаёт SVG с кривой',
  plotXY({ series: [{ label: 'a', points: [[0, 24], [5, 23], [10, 21]] }] }).includes('<path'));
assertTrue('Chart: plotXY на пустых данных отдаёт пустую строку',
  plotXY({ series: [] }) === '');
assertTrue('Chart: plotXY не падает на вырожденной прямой',
  plotXY({ series: [{ label: 'flat', points: [[0, 5], [1, 5]] }] }).includes('<svg'));

// ==================== VOLTAGE DROP ====================
function calcVoltageDrop(I, L, R, X, U, cos) {
  const sin = Math.sqrt(1 - cos * cos);
  return Math.sqrt(3) * I * L * (R * cos + X * sin) / 1000;
}

assert('VDrop: 10A/100m/7.24/0.08/380/0.85', calcVoltageDrop(10, 100, 7.24, 0.08, 380, 0.85), 10.7, 0.5);
assert('VDrop: 25A/50m/7.24/0.08/380/0.85', calcVoltageDrop(25, 50, 7.24, 0.08, 380, 0.85), 13.4, 0.5);

// ==================== SHORT CIRCUIT ====================
function calcSC(U, Z) { return U / (Math.sqrt(3) * Z); }

assert('SC: 380V/0.1Ω', calcSC(380, 0.1), 2194, 10);
assert('SC: 400V/0.05Ω', calcSC(400, 0.05), 4619, 20);

// ==================== GROUNDING ====================
function calcGrounding(rho, L, d) { return rho / (2 * Math.PI * L) * Math.log(4 * L / d); }

assert('Ground: ρ=100/L=3/d=0.02', calcGrounding(100, 3, 0.02), 33.94, 0.5);
assert('Ground: ρ=50/L=2.5/d=0.016', calcGrounding(50, 2.5, 0.016), 20.49, 0.5);

// ==================== COMPENSATION ====================
function calcComp(P, cos1, cos2) {
  const tg1 = Math.sqrt(1 - cos1 * cos1) / cos1;
  const tg2 = Math.sqrt(1 - cos2 * cos2) / cos2;
  return P * (tg1 - tg2);
}

assert('Comp: 100kW/0.6→0.95', calcComp(100, 0.6, 0.95), 100.46, 0.5);
assert('Comp: 50kW/0.7→0.95', calcComp(50, 0.7, 0.95), 34.58, 0.5);

// ==================== DIAMETER TO SECTION ====================
function calcDiam2Sec(d) { return Math.PI * d * d / 4; }

assert('Diam: 1.78mm', calcDiam2Sec(1.78), 2.49, 0.02);
assert('Diam: 2.26mm', calcDiam2Sec(2.26), 4.01, 0.02);

// ==================== RLC ====================
function calcRLC(R, L, C, f) {
  const XL = 2 * Math.PI * f * L / 1000;
  const XC = 1 / (2 * Math.PI * f * C / 1000000);
  return Math.sqrt(R * R + (XL - XC) * (XL - XC));
}

assert('RLC: 100Ω/10mH/1µF/1kHz', calcRLC(100, 10, 1, 1000), 138.85, 1);

// ==================== NE555 ====================
function calc555(R1, R2, C_uF) {
  const C = C_uF / 1000000;
  return 1.44 / ((R1 + 2 * R2) * C);
}

assert('555: R1=1k/R2=10k/C=0.1µF', calc555(1000, 10000, 0.1), 685.7, 5);
assert('555: R1=10k/R2=10k/C=1µF', calc555(10000, 10000, 1), 48, 2);

// ==================== OP-AMP ====================
function calcInvOpamp(R1, Rf) { return -Rf / R1; }
function calcNonInvOpamp(R1, Rf) { return 1 + Rf / R1; }

assert('InvOpamp: R1=10k/Rf=100k', calcInvOpamp(10, 100), -10, 0.01);
assert('NonInvOpamp: R1=10k/Rf=100k', calcNonInvOpamp(10, 100), 11, 0.01);

// ==================== WHEATSTONE ====================
function calcBridge(R1, R2, R3, R4, V) {
  return V * (R3 / (R3 + R4) - R2 / (R1 + R2));
}

assert('Bridge: balanced', calcBridge(1000, 1000, 1000, 1000, 5), 0, 0.001);
assert('Bridge: unbalanced', calcBridge(1000, 2000, 1000, 1000, 5), -0.833, 0.01);

// ==================== LED ====================
function calcLED(V, Vf, I_mA) { return (V - Vf) / (I_mA / 1000); }

assert('LED: 12V/2V/20mA', calcLED(12, 2, 20), 500, 1);
assert('LED: 5V/2V/20mA', calcLED(5, 2, 20), 150, 1);

// ==================== ZENER ====================
function calcZener(Vin, Vz, IL_mA, Iz_mA) {
  return (Vin - Vz) / ((Iz_mA + IL_mA) / 1000);
}

assert('Zener: 24V/5.1V/20mA/10mA', calcZener(24, 5.1, 20, 10), 630, 10);

// ==================== DC SOLVER (MNA) ====================
import { SchematicModel, COMPONENT_TYPES, getComponentPins, PIN_OFFSETS, formatSI, junctionPoints } from './js/schematic-model.js';
import { solveDC, solveTransient, emissionLevel, emissionColor } from './js/circuit-sim.js';
import { PRESETS, loadPreset } from './js/schematic-presets.js';

output.innerHTML += '<h3 style="color:#FFB300;margin-top:16px">DC solver</h3>';

function assertTrue(name, cond) {
  if (cond) { passed++; output.innerHTML += `<div class="test"><span class="pass">✓</span> ${name}</div>`; }
  else { failed++; output.innerHTML += `<div class="test"><span class="fail">✗</span> ${name}</div>`; }
}

/** Добавить компонент и вернуть абсолютные координаты его выводов. */
function put(m, type, x, y, opts) {
  const c = m.addComponent(type, x, y, opts);
  return getComponentPins(c, COMPONENT_TYPES[type]);
}

/**
 * Цепочка резисторов, запитанная источником E, с возвратом через землю.
 * Резисторы стоят столбиком по x=70, обратный провод идёт НИЖЕ последнего
 * резистора — иначе он замкнул бы его накоротко.
 */
function seriesCircuit(E, resistances) {
  const m = new SchematicModel();
  const n = resistances.length;
  const bottom = 40 * n + 30;

  const gb = put(m, 'vsource', 30, 60, { id: 'GB1', value: E, rotate: 90 });
  const gnd = put(m, 'ground', 30, bottom + 5, { id: 'GND1' });

  let prev = gb.p;
  resistances.forEach((R, i) => {
    const y = 40 + 40 * i;
    const r = put(m, 'resistor', 70, y, { id: 'R' + (i + 1), value: R, rotate: 90 });
    m.addWire(i === 0 ? [prev, [30, y - 10], r.a] : [prev, r.a]);
    prev = r.b;
  });

  m.addWire([prev, [70, bottom], gnd.g]);
  m.addWire([gb.n, gnd.g]);
  return m;
}

// --- делитель напряжения ---
{
  const r = solveDC(seriesCircuit(12, [10000, 10000]));
  assertTrue('Solver: divider solves', r.ok);
  assert('Divider: U(R1)', r.branches.R1.u, 6, 1e-6);
  assert('Divider: U(R2)', r.branches.R2.u, 6, 1e-6);
  assert('Divider: I', r.branches.R1.i, 6e-4, 1e-9);
  assert('Divider: P(R1)', r.branches.R1.p, 3.6e-3, 1e-9);
  assert('Divider: source delivers (P<0)', Math.sign(r.branches.GB1.p), -1, 0);
}

// --- последовательное сопротивление: 3 резистора ---
{
  const r = solveDC(seriesCircuit(9, [100, 200, 300]));
  const I = 9 / 600;
  assert('Series: I', r.branches.R1.i, I, 1e-9);
  assert('Series: U(R3)', r.branches.R3.u, I * 300, 1e-6);

/** Последовательная RC- или RL-цепь: источник, резистор, реактивный элемент. */
function seriesReactive(kind, E, R, X) {
  const m = new SchematicModel();
  const gb = put(m, 'vsource', 30, 60, { id: 'GB1', value: E, rotate: 90 });
  const r1 = put(m, 'resistor', 70, 25, { id: 'R1', value: R });
  const el = put(m, kind, 110, 60, { id: kind === 'capacitor' ? 'C1' : 'L1', value: X, rotate: 90 });
  const gnd = put(m, 'ground', 70, 105, { id: 'GND1' });
  m.addWire([[20, 100], [130, 100]]);
  m.addWire([gb.p, [30, 25], r1.a]);
  m.addWire([r1.b, [110, 25], el.a]);
  m.addWire([el.b, [110, 100]]);
  m.addWire([gb.n, [30, 100]]);
  return m;
}
/** Значение ряда в момент времени t. */
function atTime(res, series, time) {
  const i = res.t.findIndex(v => v >= time - 1e-12);
  return series[i < 0 ? series.length - 1 : i];
}

// Заряд конденсатора: U(t) = E·(1 − e^(−t/RC)), τ = 0.1 с
{
  const tau = 1000 * 100e-6;
  const r = solveTransient(seriesReactive('capacitor', 10, 1000, 100e-6), { tStop: 0.5, tStep: 1e-4 });
  assertTrue('Transient RC: solves', r.ok);
  const u = r.branches.C1.u;
  assert('RC: U(0) = 0 (начальные условия)', u[0], 0, 1e-9);
  assert('RC: U(τ) ≈ 63.2% от E', atTime(r, u, tau), 10 * (1 - Math.exp(-1)), 0.01);
  assert('RC: U(3τ) ≈ 95%', atTime(r, u, 3 * tau), 10 * (1 - Math.exp(-3)), 0.01);
  assert('RC: U(5τ) ≈ E', u[u.length - 1], 10 * (1 - Math.exp(-5)), 0.01);
  assertTrue('RC: напряжение монотонно растёт', u.every((v, i) => i === 0 || v >= u[i - 1] - 1e-12));
  // Разряженный конденсатор в первый момент ведёт себя как перемычка,
  // поэтому ток ограничен только резистором
  assert('RC: I(0) = E/R', atTime(r, r.branches.R1.i, 0), 10 / 1000, 1e-9);
  assertTrue('RC: ток спадает к нулю', Math.abs(r.branches.R1.i[r.branches.R1.i.length - 1]) < 1e-3);
}
// Уменьшение шага уменьшает погрешность — признак сходимости метода
{
  const tau = 0.1, exact = 10 * (1 - Math.exp(-1));
  const err = h => Math.abs(atTime(
    solveTransient(seriesReactive('capacitor', 10, 1000, 100e-6), { tStop: 0.2, tStep: h }),
    solveTransient(seriesReactive('capacitor', 10, 1000, 100e-6), { tStop: 0.2, tStep: h }).branches.C1.u,
    tau) - exact);
  assertTrue('RC: мельче шаг — точнее результат', err(1e-4) < err(1e-3));
}

  assert('RC разряд: U(τ) ≈ 36.8%', atTime(r, u, 0.1), 10 * Math.exp(-1), 0.01);
  assertTrue('RC разряд: напряжение монотонно падает', u.every((v, i) => i === 0 || v <= u[i - 1] + 1e-12));
}
// Ток в катушке: I(t) = (E/R)·(1 − e^(−t·R/L)), τ = L/R = 0.1 с
{
  const r = solveTransient(seriesReactive('inductor', 10, 10, 1), { tStop: 0.6, tStep: 1e-4 });
  assertTrue('Transient RL: solves', r.ok);
  const i = r.branches.L1.i;
  assert('RL: I(0) = 0 (ток в катушке не меняется скачком)', i[0], 0, 1e-9);
  assert('RL: I(τ) ≈ 63.2% от E/R', atTime(r, i, 0.1), 1 * (1 - Math.exp(-1)), 1e-3);
  assert('RL: I(∞) → E/R', i[i.length - 1], 1, 5e-3);
}
// Катушка с начальным током
{
  const m = seriesReactive('inductor', 0, 10, 1);

// Установившийся режим совпадает со статическим расчётом

// Имена выводов в описании типа обязаны совпадать с геометрией — иначе
// солвер молча принимает вывод за землю.
{
  let ok = true;
  for (const [type, def] of Object.entries(COMPONENT_TYPES)) {
    const keys = Object.keys(PIN_OFFSETS[type] || {});
    if (def.pins.some(p => !keys.includes(p))) { ok = false; break; }
  }
  assertTrue('Pin names match pin geometry for every type', ok);
}

// Выводы всех типов обязаны попадать в узлы сетки 5 мм — иначе провод
// не сойдётся с концом УГО, а элемент нельзя аккуратно поставить на схему.
{
  const off = [];
  for (const [type, pins] of Object.entries(PIN_OFFSETS)) {
    for (const [name, [x, y]] of Object.entries(pins)) {
      if (x % 5 !== 0 || y % 5 !== 0) off.push(`${type}.${name}=(${x},${y})`);
    }
  }
  assertTrue('Every pin offset lands on the 5 mm grid' + (off.length ? ' — ' + off.join(', ') : ''), off.length === 0);
}

// Все пресеты: связи ортогональны и лежат на сетке 5 мм.
{
  let ortho = true, onGrid = true;
  for (const p of PRESETS) {
    for (const w of p.create().wires) {
      for (const pt of w.points) if (pt[0] % 5 || pt[1] % 5) onGrid = false;
      for (let i = 1; i < w.points.length; i++) {
        const [x1, y1] = w.points[i - 1], [x2, y2] = w.points[i];
        if (x1 !== x2 && y1 !== y2) ortho = false;
      }
    }
  }
  assertTrue('All preset wires are orthogonal', ortho);
  assertTrue('All preset wire points are on the 5 mm grid', onGrid);
}

// Ни один провод пресета не обрывается в пустоте: конец провода обязан попасть
// в вывод компонента или лечь на другой провод. Висячий «ус» шины — чертёжный
// брак: на схеме он читается как незавершённая связь.
{
  const near = (a, b, t = 0.6) => Math.abs(a[0] - b[0]) < t && Math.abs(a[1] - b[1]) < t;
  const onSeg = (p, a, b, t = 0.6) => {
    const dx = b[0] - a[0], dy = b[1] - a[1], L2 = dx * dx + dy * dy;
    if (!L2) return near(p, a, t);
    let u = ((p[0] - a[0]) * dx + (p[1] - a[1]) * dy) / L2;
    u = Math.max(0, Math.min(1, u));
    return Math.hypot(a[0] + u * dx - p[0], a[1] + u * dy - p[1]) < t;
  };
  const dangling = [];
  for (const preset of PRESETS) {
    const m = preset.create();
    const pins = [];
    for (const c of m.components) {
      for (const xy of Object.values(getComponentPins(c, COMPONENT_TYPES[c.type]))) pins.push(xy);
    }
    for (const w of m.wires) {
      for (const end of [w.points[0], w.points[w.points.length - 1]]) {
        if (pins.some(p => near(p, end))) continue;
        let onWire = false;
        for (const o of m.wires) {
          if (o.id === w.id) continue;
          for (let i = 0; i < o.points.length - 1; i++) if (onSeg(end, o.points[i], o.points[i + 1])) onWire = true;
        }
        if (!onWire) dangling.push(`${preset.id}@${end[0]},${end[1]}`);
      }
    }
  }
  assertTrue('No preset wire ends in mid-air' + (dangling.length ? ' — ' + dangling.join(', ') : ''),
    dangling.length === 0);
}

// Провода не должны идти по корпусу УГО: линия, наложенная на грань
// прямоугольника, визуально сливается с ним и связь перестаёт читаться.
// Полугабариты корпусов взяты из gost-schematic.js (box/optocoupler).
{
  const HALF = { opamp: [10, 10], ic: [10, 12], optocoupler: [15, 10] };
  const hits = [];
  for (const preset of PRESETS) {
    const m = preset.create();
    const boxes = m.components
      .filter(c => HALF[c.type])
      .map(c => {
        const [hw, hh] = HALF[c.type];
        const swap = (((c.rotate || 0) % 360 + 360) % 360) % 180 === 90;
        return { id: c.id, cx: c.x, cy: c.y, hw: swap ? hh : hw, hh: swap ? hw : hh };
      });
    for (const w of m.wires) {
      for (let i = 0; i < w.points.length - 1; i++) {
        const a = w.points[i], b = w.points[i + 1];
        for (const box of boxes) {
          const steps = Math.max(2, Math.ceil(Math.hypot(b[0] - a[0], b[1] - a[1]) / 0.5));
          let inside = 0;
          for (let s = 0; s <= steps; s++) {
            const t = s / steps, x = a[0] + (b[0] - a[0]) * t, y = a[1] + (b[1] - a[1]) * t;
            if (Math.abs(x - box.cx) <= box.hw + 0.25 && Math.abs(y - box.cy) <= box.hh + 0.25) inside++;
          }
          const len = inside / steps * Math.hypot(b[0] - a[0], b[1] - a[1]);
          if (len > 1.2) hits.push(`${preset.id}:${box.id}`);
        }
      }
    }
  }
  assertTrue('No preset wire runs along a component body' + (hits.length ? ' — ' + hits.join(', ') : ''),
    hits.length === 0);
}

// Ключ переключается вручную — в том числе не выходя из режима эмуляции.
{
  const m = loadPreset('switch-lamp');
  const s1 = m.getComponent('S1');
  const lampLevel = () => {
    const r = solveDC(m);
    return r.ok ? emissionLevel('lamp', r.branches.HL1) : -1;
  };

  assertTrue('Preset starts with the switch closed', Number(s1.value) !== 0);
  assertTrue('Lamp is lit while the switch is closed', lampLevel() > 0);

  assertTrue('Toggling a switch reports success', m.toggleSwitch('S1') === true);
  assertTrue('Switch is now open', Number(s1.value) === 0);
  assertTrue('Open switch leaves the lamp dark', lampLevel() === 0);

  m.toggleSwitch('S1');
  assertTrue('Toggling again closes the switch', Number(s1.value) !== 0);
  assertTrue('Closed switch lights the lamp again', lampLevel() > 0);

  // Контакты реле подчиняются катушке, а не руке: их дёргать нельзя.

  const k2 = relay.getComponent('K2');

  assertTrue('A relay contact refuses to be toggled by hand', relay.toggleSwitch('K2') === false);
  assertTrue('The relay contact keeps its state', relay.getComponent('K2').value === before);
  assertTrue('A resistor is not a switch', relay.toggleSwitch('K1') === false);
  assertTrue('An unknown id toggles nothing', relay.toggleSwitch('NOPE') === false);
}

// Свечение светодиода и лампы: уровень 0…1 от протекающего тока.
{
  const led = (i) => emissionLevel('led', { i, p: i * 2 });

  assertTrue('Dark LED at zero current', led(0) === 0);
  // Закрытый переход пропускает ток утечки u·G_OPEN — светиться он не должен.
  assertTrue('Leakage current leaves the LED dark', led(1e-9) === 0);
  assertTrue('Reverse current leaves the LED dark', led(-0.02) === 0);
  assertTrue('Sub-threshold current leaves the LED dark', led(0.0005) === 0);

  assertTrue('LED lights up above the threshold', led(0.005) > 0);
  assertTrue('Brightness grows with current', led(0.005) < led(0.012));
  assertTrue('LED reaches full brightness at its rated current', Math.abs(led(0.02) - 1) < 1e-9);
  assertTrue('Brightness saturates above the rating', led(0.2) === 1);
  assertTrue('Brightness never leaves 0…1', led(1e6) <= 1 && led(0.008) >= 0);

  // Лампа накаливания светит пропорционально рассеиваемой мощности, а не току:
  // одинаковый ток на разном сопротивлении даёт разную яркость.
  const lampAt = (p) => emissionLevel('lamp', { i: 0.1, p });
  assertTrue('Cold lamp at zero power', lampAt(0) === 0);
  assertTrue('Lamp ignores the sign of power', lampAt(-1) === lampAt(1));
  assertTrue('Lamp brightness grows with power', lampAt(0.2) < lampAt(0.6));
  assertTrue('Lamp reaches full brightness at its rated power', Math.abs(lampAt(1) - 1) < 1e-9);
  assertTrue('Lamp brightness saturates', lampAt(50) === 1);

  // Прочие элементы не светятся вовсе.
  assertTrue('A resistor never glows', emissionLevel('resistor', { i: 1, p: 100 }) === 0);
  assertTrue('Unknown type never glows', emissionLevel(undefined, { i: 1, p: 1 }) === 0);
  assertTrue('Missing branch data never glows', emissionLevel('led', undefined) === 0);

  // Цвет светодиода читается из прямого напряжения — отдельного свойства нет.
  assertTrue('Red LED at 2.0 V', emissionColor('led', 2.0) === emissionColor('led', 1.8));
  assertTrue('Colour changes with the forward voltage', emissionColor('led', 2.0) !== emissionColor('led', 3.2));
  assertTrue('Lamp colour does not depend on its resistance',
    emissionColor('lamp', 100) === emissionColor('lamp', 240));
  assertTrue('Every colour is a hex value', /^#[0-9A-Fa-f]{6}$/.test(emissionColor('led', 2.6)));
}

// Лента: потери считаются по всем питающим ответвлениям, а не по одному.
{
  const base = {
    mode: 'single', voltage: 24, material: 'Cu', parallelWires: 1,
    maxDropPercent: 5, ambientTemp: 25, laying: 'air',
    length: 10, wattPerMeter: 14.4, trackResistance: 0.6, wireLength: 5,
  };
  const one = calcStripSystem({ ...base, feedScheme: 'one' });
  const both = calcStripSystem({ ...base, feedScheme: 'both' });
  assertTrue('Лента: оба расчёта успешны', one.ok && both.ok);

  // Потери обязаны учитывать ВСЕ питающие ответвления. Сравнивать две схемы
  // напрямую нельзя: сечение подбирается, и при меньшем токе выбирается более
  // тонкий провод. Поэтому сверяем с формулой n · I² · R для каждой схемы,
  // где R = 2·L·ρ/S. До исправления множителя n не было.
  const rOne = one.branches[0], rBoth = both.branches[0];
  const RHO = 0.0175, LEN = 5;
  const wireR = section => 2 * LEN * RHO / section;

  assert('Лента: потери с одного конца = 1 × I² × R',
    rOne.powerLoss, 1 * rOne.feedCurrent ** 2 * wireR(rOne.section), 1e-6);
  assert('Лента: потери с двух концов = 2 × I² × R',
    rBoth.powerLoss, 2 * rBoth.feedCurrent ** 2 * wireR(rBoth.section), 1e-6);
  assertTrue('Лента: ток на провод при двух концах вдвое меньше',
    Math.abs(rBoth.feedCurrent / rOne.feedCurrent - 0.5) < 1e-9);
  assertTrue('Лента: потери не нулевые', rBoth.powerLoss > 0);

  // Просадка на дорожках при этом падает именно вчетверо — это свойство схемы.
  assert('Лента: просадка на дорожках падает вчетверо',
    rBoth.dropStrip / rOne.dropStrip, 0.25, 0.001);
}

// Одного признака «замкнут» мало: его должно быть видно на чертеже. Проверяем
// саму разметку УГО, потому что именно она и разъехалась с расчётом.
{
  const draw = opts => {
    const s = new window.GostSchematic.Schematic({ width: 60, height: 40 });
    s.contact('K1', 30, 20, opts);
    return s.toSVG();
  };
  // Наклонная линия подвижного контакта — признак разомкнутого положения,
  // горизонтальная перемычка — замкнутого.
  const tilted = svg => /L\s+3\s+-4/.test(svg);

  assertTrue('УГО: разомкнутый замыкающий контакт нарисован под углом',
    tilted(draw({ kind: 'no', closed: false })));
  assertTrue('УГО: замкнутый замыкающий контакт нарисован перемычкой',
    tilted(draw({ kind: 'no', closed: true })) === false);
  assertTrue('УГО: замкнутый размыкающий контакт нарисован перемычкой',
    tilted(draw({ kind: 'nc', closed: true })) === false);
  assertTrue('УГО: разомкнутый размыкающий контакт нарисован под углом',
    tilted(draw({ kind: 'nc', closed: false })));

  // Размыкающий контакт отличается от замыкающего упором на неподвижной части —
  // по нему на чертеже и читают тип контакта, в любом положении.
  const stop = svg => svg.includes('M 3 0 v -1');
  assertTrue('УГО: у размыкающего контакта есть упор в замкнутом положении',
    stop(draw({ kind: 'nc', closed: true })));
  assertTrue('УГО: у размыкающего контакта есть упор и в разомкнутом положении',
    stop(draw({ kind: 'nc', closed: false })));
  assertTrue('УГО: у замыкающего контакта упора нет',
    stop(draw({ kind: 'no', closed: false })) === false);

  // Выводы регистрируются одинаково в любом положении: иначе провода,
  // притянутые к контакту, отвалились бы при срабатывании.
  const s = new window.GostSchematic.Schematic({ width: 60, height: 40 });
  s.contact('K1', 30, 20, { kind: 'no', closed: false });
  s.contact('K2', 30, 35, { kind: 'no', closed: true });
  assertTrue('УГО: положение контакта не двигает его выводы',
    s.pin('K1', 'a')[0] === s.pin('K2', 'a')[0] && s.pin('K1', 'b')[0] === s.pin('K2', 'b')[0]);
}

// ==================== КОНТАКТЫ РЕЛЕ НА ЧЕРТЕЖЕ ====================
// Обычный ключ хранит своё состояние в модели, а контакт реле — нет: он
// подчиняется катушке, и его положение известно только после расчёта. Пока
// чертёж рисовал контакт по одному типу, замыкающий контакт оставался
// разомкнутым даже при сработавшей катушке — схема противоречила числам.
{
  const ok = res => ({ ok: true, branches: res });

  // Катушка сработала: замыкающий контакт замкнут, размыкающий разомкнут.
  const picked = ok({ K2: { region: 'ct_closed' }, K3: { region: 'ct_open' } });
  assertTrue('Контакт: замыкающий при сработавшей катушке — замкнут',
    contactClosed({ id: 'K2', type: 'contactNO' }, picked) === true);
  assertTrue('Контакт: размыкающий при сработавшей катушке — разомкнут',
    contactClosed({ id: 'K3', type: 'contactNC' }, picked) === false);

  // Катушка отпущена: положения возвращаются к исходным.
  const released = ok({ K2: { region: 'ct_open' }, K3: { region: 'ct_closed' } });
  assertTrue('Контакт: замыкающий при отпущенной катушке — разомкнут',
    contactClosed({ id: 'K2', type: 'contactNO' }, released) === false);
  assertTrue('Контакт: размыкающий при отпущенной катушке — замкнут',
    contactClosed({ id: 'K3', type: 'contactNC' }, released) === true);

  // Без расчёта (режим правки) контакт рисуется в исходном положении: NO
  // разомкнут, NC замкнут — так его и чертят на схеме обесточенного щита.
  assertTrue('Контакт: без расчёта замыкающий разомкнут',
    contactClosed({ id: 'K2', type: 'contactNO' }, null) === false);
  assertTrue('Контакт: без расчёта размыкающий замкнут',
    contactClosed({ id: 'K3', type: 'contactNC' }, null) === true);

  // Расчёт есть, но этого контакта в нём нет (например, ветвь отброшена):
  // исходное положение, а не случайное.
  assertTrue('Контакт: отсутствие ветви в расчёте не переключает контакт',
    contactClosed({ id: 'K9', type: 'contactNO' }, ok({})) === false);

  // Неуспешный расчёт не имеет права двигать контакты.
  assertTrue('Контакт: при неуспешном расчёте остаётся исходное положение',
    contactClosed({ id: 'K2', type: 'contactNO' }, { ok: false }) === false);
}

// Связка расчёта и чертежа на боевой схеме: реле с самоподхватом. Именно здесь
// чертёж и разъезжался с числами — контакт K2 нёс 100 мА, оставаясь на вид
// разомкнутым.
{
  const m = loadPreset('relay-latch');
  const sim = solveDC(m);
  assertTrue('Реле: расчёт схемы с самоподхватом успешен', sim.ok);
  assertTrue('Реле: катушка K1 сработала', sim.branches.K1.region === 'coil_on');
  assertTrue('Реле: замыкающий контакт K2 показан замкнутым',
    contactClosed(m.getComponent('K2'), sim) === true);
  assertTrue('Реле: размыкающий контакт K3 показан разомкнутым',
    contactClosed(m.getComponent('K3'), sim) === false);

  // Контакт, который несёт ток, обязан выглядеть замкнутым: расхождение
  // чертежа с числами рядом — это и был баг.
  assertTrue('Реле: ток через K2 не нулевой', Math.abs(sim.branches.K2.i) > 1e-6);
  assertTrue('Реле: через разомкнутый K3 ток не идёт', Math.abs(sim.branches.K3.i) < 1e-9);
}

// ==================== SLEEVE FILL ====================
// Гильза подбирается по СУММАРНОМУ сечению скручиваемых жил — так устроены
// каталоги. Числа ряда приблизительные (см. шапку sleeve-data.js), поэтому
// тесты проверяют поведение расчёта и консистентность таблицы, а не то,
// что конкретный типоразмер имеет именно такой внутренний диаметр.
{
  const two25 = calcSleeve({ conductors: [{ S: 2.5, qty: 2 }], material: 'cu', flexClass: 5 });
  assertTrue('Гильза: 2×2.5 мм² — расчёт успешен', two25.ok);
  assert('Гильза: суммарное сечение 2×2.5 мм²', two25.sumS, 5, 1e-9);
  assertTrue('Гильза: 2×2.5 мм² укладывается в ГМЛ-6', two25.sleeve.id === 'ГМЛ-6');
}

// Заполнение считается по площади, которую занимают жилы В ГАБАРИТЕ, а не по
// сумме их сечений: гибкая многопроволочная жила при том же сечении толще
// монолитной, потому что между проволоками есть пустоты.
{
  const solid = calcSleeve({ conductors: [{ S: 2.5, qty: 2 }], material: 'cu', flexClass: 1 });
  const flex = calcSleeve({ conductors: [{ S: 2.5, qty: 2 }], material: 'cu', flexClass: 5 });

  assert('Гильза: монолит занимает ровно своё сечение', solid.condArea, solid.sumS, 1e-9);
  assertTrue('Гильза: гибкая жила занимает больше своего сечения', flex.condArea > flex.sumS);
  assertTrue('Гильза: класс 5 заполняет гильзу плотнее класса 1', flex.fillPct > solid.fillPct);
  assertTrue('Гильза: класс гибкости не меняет типоразмер', flex.sleeve.id === solid.sleeve.id);

  // Заполнение — доля площади канала, то есть считается по ВНУТРЕННЕМУ
  // диаметру. Наружный сюда попасть не должен: он больше, и заполнение вышло
  // бы заниженным, а гильза — ложно свободной.
  const channel = Math.PI * flex.sleeve.dIn ** 2 / 4;
  assert('Гильза: заполнение = площадь жил / площадь канала', flex.fillPct, flex.condArea / channel * 100, 1e-9);
}

// Статус — то, что монтажник читает вместо процентов. Проверяется не по
// конкретным числам ряда (они подлежат сверке), а по согласованности статуса
// с порогами: после правки таблицы связь обязана сохраниться.
{
  const cases = [
    calcSleeve({ conductors: [{ S: 1.5, qty: 2 }], material: 'cu', flexClass: 1 }),
    calcSleeve({ conductors: [{ S: 2.5, qty: 2 }], material: 'cu', flexClass: 5 }),
    calcSleeve({ conductors: [{ S: 16, qty: 1 }], material: 'cu', flexClass: 5 }),
    calcSleeve({ conductors: [{ S: 16, qty: 1 }], material: 'cu', flexClass: 6 }),
    calcSleeve({ conductors: [{ S: 6, qty: 3 }], material: 'cu', flexClass: 5 }),
  ];
  const expected = f => f < FILL_LIMITS.loose ? 'loose'
    : f < FILL_LIMITS.tight ? 'ok'
    : f <= FILL_LIMITS.over ? 'tight' : 'over';
  assertTrue('Гильза: статус согласован с порогами заполнения',
    cases.every(r => r.status === expected(r.fillPct)));

  // Монолит 2×1.5 болтается в гильзе — это тот случай, ради которого считается
  // добивка: без неё опрессовка сомнёт гильзу, а контакта не даст.
  const loose = cases[0];
  assertTrue('Гильза: 2×1.5 мм² монолитом — гильза свободна', loose.status === 'loose');
  assertTrue('Гильза: свободной гильзе назначена добивка', loose.filler > 0);
  assert('Гильза: добивка доводит заполнение ровно до нижнего порога',
    (loose.condArea + loose.filler) / (Math.PI * loose.sleeve.dIn ** 2 / 4) * 100,
    FILL_LIMITS.loose, 1e-9);

  const normal = cases[1];
  assertTrue('Гильза: при нормальном заполнении статус ok', normal.status === 'ok');
  assert('Гильза: при нормальном заполнении добивка не нужна', normal.filler, 0, 1e-12);
}

// Заполнение обязано расти с добавлением жил. Сравнивать можно только внутри
// одного типоразмера: с ростом суммы подбирается гильза крупнее, и процент
// после перехода закономерно падает.
{
  const two = calcSleeve({ conductors: [{ S: 1.5, qty: 2 }], material: 'cu', flexClass: 5 });
  const three = calcSleeve({ conductors: [{ S: 1.5, qty: 2 }, { S: 1, qty: 1 }], material: 'cu', flexClass: 5 });
  assertTrue('Гильза: сравниваются две суммы в одном типоразмере', two.sleeve.id === three.sleeve.id);
  assertTrue('Гильза: лишняя жила увеличивает заполнение', three.fillPct > two.fillPct);
}

// Материал жил задаёт материал гильзы. Медь с алюминием напрямую соединять
// нельзя: пара даёт электрохимическую коррозию и контакт выгорает, поэтому
// для такого соединения отбираются только биметаллические гильзы.
{
  const cu = calcSleeve({ conductors: [{ S: 25, qty: 2 }], material: 'cu', flexClass: 5 });
  const al = calcSleeve({ conductors: [{ S: 25, qty: 2 }], material: 'al', flexClass: 1 });
  const bi = calcSleeve({ conductors: [{ S: 25, qty: 2 }], material: 'cu-al', flexClass: 1 });

  assertTrue('Гильза: медным жилам — медная гильза', cu.ok && cu.sleeve.material === 'cu');
  assertTrue('Гильза: алюминиевым жилам — алюминиевая гильза', al.ok && al.sleeve.material === 'al');
  assertTrue('Гильза: медь с алюминием — только биметалл', bi.ok && bi.sleeve.material === 'bi');

  // Семейство можно задать явно — например, когда на объекте есть только ГМЛ-П.
  const forced = calcSleeve({ conductors: [{ S: 25, qty: 2 }], material: 'cu', flexClass: 5, family: 'ГМЛ-П' });
  assertTrue('Гильза: заданное семейство соблюдается', forced.ok && forced.sleeve.family === 'ГМЛ-П');

  // Семейство, которого нет под этот материал, — отказ с причиной, а не молча
  // выбранная гильза из другого семейства.
  const wrong = calcSleeve({ conductors: [{ S: 25, qty: 2 }], material: 'al', flexClass: 1, family: 'ГМЛ' });
  assertTrue('Гильза: чужое семейство отбито', wrong.ok === false);
  assertTrue('Гильза: у отказа по семейству есть ключ сообщения', wrong.messageKey === 'sleeve.err_no_family');
}

// Края ряда. Снизу — не отказ: монтажнику нужна работающая рекомендация, и
// наименьшая гильза с добивкой её даёт. Сверху отказ обязателен: соединение
// такого сечения одной гильзой не собирают, его делят.
{
  const small = calcSleeve({ conductors: [{ S: 2.5, qty: 2 }], material: 'al', flexClass: 1 });
  const smallestAl = SLEEVES.filter(s => s.material === 'al')[0];
  assertTrue('Гильза: сумма ниже ряда — предложена наименьшая гильза', small.ok && small.sleeve.id === smallestAl.id);
  assertTrue('Гильза: наименьшая гильза при малой сумме свободна', small.status === 'loose');
  assertTrue('Гильза: при малой сумме назначена добивка', small.filler > 0);
  assertTrue('Гильза: выход за нижний край ряда отмечен предупреждением',
    small.warnings.includes('sleeve.warn_below_range'));

  const huge = calcSleeve({ conductors: [{ S: 240, qty: 2 }], material: 'cu', flexClass: 1 });
  assertTrue('Гильза: сумма выше ряда — отказ', huge.ok === false);
  assertTrue('Гильза: у отказа по верхнему краю есть ключ сообщения', huge.messageKey === 'sleeve.err_over_range');

  const normal = calcSleeve({ conductors: [{ S: 2.5, qty: 2 }], material: 'cu', flexClass: 5 });
  assertTrue('Гильза: в норме предупреждений нет', normal.warnings.length === 0);
}

// Вырожденный ввод возвращает отказ с ключом, а не бросает исключение и не
// считает по нулям: страница показывает локализованный текст причины.
{
  assertTrue('Гильза: пустой список жил отбит',
    calcSleeve({ conductors: [], material: 'cu' }).messageKey === 'sleeve.err_empty');
  assertTrue('Гильза: нулевое сечение отбито',
    calcSleeve({ conductors: [{ S: 0, qty: 2 }], material: 'cu' }).messageKey === 'sleeve.err_empty');
  assertTrue('Гильза: нулевое количество отбито',
    calcSleeve({ conductors: [{ S: 2.5, qty: 0 }], material: 'cu' }).messageKey === 'sleeve.err_empty');
  assertTrue('Гильза: отрицательное сечение отбито',
    calcSleeve({ conductors: [{ S: -2.5, qty: 1 }], material: 'cu' }).messageKey === 'sleeve.err_section');
  assertTrue('Гильза: отрицательное количество отбито',
    calcSleeve({ conductors: [{ S: 2.5, qty: -1 }], material: 'cu' }).messageKey === 'sleeve.err_section');
}

// Границы диапазонов. Ряд смежный, и ошибка на единицу в сравнении увела бы
// пограничное значение в соседний типоразмер — молча и незаметно.
{
  const gml = SLEEVES.filter(s => s.family === 'ГМЛ');
  const pick = S => calcSleeve({ conductors: [{ S, qty: 1 }], material: 'cu', flexClass: 1, family: 'ГМЛ' }).sleeve.id;
  assertTrue('Гильза: верхняя граница диапазона остаётся в своей гильзе',
    gml.every(s => pick(s.sMax) === s.id));
  assertTrue('Гильза: значение сразу над нижней границей попадает в свою гильзу',
    gml.every(s => pick(s.sMin + 0.01) === s.id));
}

// Консистентность таблицы. Числа ряда подлежат сверке с каталогом, и эти
// проверки существуют затем, чтобы сверка не внесла противоречий.
{
  const families = [...new Set(SLEEVES.map(s => s.family))];
  assertTrue('Данные гильз: каждое семейство описано в SLEEVE_FAMILIES',
    families.every(f => !!SLEEVE_FAMILIES[f]));
  assertTrue('Данные гильз: материал записи совпадает с материалом семейства',
    SLEEVES.every(s => SLEEVE_FAMILIES[s.family].material === s.material));
  assertTrue('Данные гильз: у каждой записи заполнены матрица и стандарт',
    SLEEVES.every(s => !!s.die && !!s.std));
  assertTrue('Данные гильз: внутренний диаметр меньше наружного',
    SLEEVES.every(s => s.dIn < s.dOut));
  assertTrue('Данные гильз: длина и диаметры положительны',
    SLEEVES.every(s => s.dIn > 0 && s.len > 0));

  const rows = f => SLEEVES.filter(s => s.family === f);
  assertTrue('Данные гильз: диапазоны семейства идут без дыр и пересечений',
    families.every(f => rows(f).every((s, i, arr) => i === 0 || arr[i - 1].sMax === s.sMin)));
  assertTrue('Данные гильз: диапазон каждой записи не пустой',
    SLEEVES.every(s => s.sMin < s.sMax));
  assertTrue('Данные гильз: внутренний диаметр растёт вместе с диапазоном',
    families.every(f => rows(f).every((s, i, arr) => i === 0 || arr[i - 1].dIn < s.dIn)));
  assertTrue('Данные гильз: идентификаторы уникальны',
    new Set(SLEEVES.map(s => s.id)).size === SLEEVES.length);

  // Медный ряд обязан покрывать весь стандартный ряд сечений: одиночная жила
  // любого сечения из ГОСТ 22483 должна находить себе гильзу.
  assertTrue('Данные гильз: стандартный ряд сечений покрыт медными гильзами',
    STD_SECTIONS.every(S => calcSleeve({ conductors: [{ S, qty: 1 }], material: 'cu', flexClass: 1 }).ok));
}

// Разрез — иллюстрация, а не проверка укладки: жилы раскладываются кольцами по
// отношению длин окружностей и при плотном заполнении могут вылезти за канал.
// Но сами кружки обязаны быть настоящими: по одному на жилу, нужного диаметра
// и без наложений друг на друга.
{
  const wires = sleeveWireLayout([{ S: 2.5, qty: 5 }], 5);
  assertTrue('Разрез: по кружку на каждую жилу', wires.length === 5);

  // Диаметр кружка — габарит жилы, то есть считается из занимаемой площади,
  // а не из сечения металла: иначе гибкая жила рисовалась бы тоньше, чем есть.
  assert('Разрез: диаметр кружка отвечает габариту жилы',
    Math.PI * wires[0].d ** 2 / 4, 2.5 / 0.70, 1e-9);

  const overlap = wires.some((a, i) => wires.some((b, j) =>
    j > i && Math.hypot(a.x - b.x, a.y - b.y) < (a.d + b.d) / 2 - 1e-6));
  assertTrue('Разрез: кружки жил не накладываются друг на друга', overlap === false);

  // Толстая жила ложится в центр, вокруг неё — кольцо из тонких.
  const mixed = sleeveWireLayout([{ S: 16, qty: 1 }, { S: 1.5, qty: 4 }], 1);
  assertTrue('Разрез: в центре — самая толстая жила',
    mixed[0].x === 0 && mixed[0].y === 0 && mixed[0].d === Math.max(...mixed.map(w => w.d)));
  assertTrue('Разрез: остальные жилы выстроены вокруг центральной',
    mixed.slice(1).every(w => Math.hypot(w.x, w.y) > 0));

  assertTrue('Разрез: пустой список жил даёт пустую раскладку', sleeveWireLayout([], 1).length === 0);
}

// Круги той же площади лежат в канале хуже, чем реальные жилы: те при
// опрессовке сминаются и заполняют углы, а круг остаётся кругом. Поэтому
// раскладка вписывается в канал — иначе рисунок противоречил бы статусу и
// показывал бы вылезающие жилы там, где заполнение всего 70 %.
{
  const channelR = 3.6 / 2;
  const tight = sleeveWireLayout([{ S: 2.5, qty: 2 }], 5);
  const scale = sleeveCutScale(tight, channelR, 'ok');
  assertTrue('Разрез: тесная раскладка ужимается до канала', scale < 1);
  assertTrue('Разрез: после масштабирования жилы внутри канала',
    tight.every(w => (Math.hypot(w.x, w.y) + w.d / 2) * scale <= channelR + 1e-9));

  // Свободная раскладка не раздувается: расстояние до стенки — тоже информация.
  const loose = sleeveWireLayout([{ S: 1.5, qty: 1 }], 1);
  assert('Разрез: свободная раскладка остаётся в своём масштабе',
    sleeveCutScale(loose, channelR, 'ok'), 1, 1e-12);

  // При переполнении жилы обязаны вылезти: именно это и говорит статус.
  assert('Разрез: при переполнении раскладка не ужимается',
    sleeveCutScale(tight, channelR, 'over'), 1, 1e-12);

  assert('Разрез: пустая раскладка не ломает масштаб', sleeveCutScale([], channelR, 'ok'), 1, 1e-12);
}

// ==================== SUMMARY ====================
summary.innerHTML = `<div class="summary ${failed === 0 ? 'ok' : 'err'}">${passed} passed, ${failed} failed (total: ${passed + failed})</div>`;
</script>
